name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build Android Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod for Android
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: 'geode-sdk/bindings'
          combine: true
          target: 'android64'
